name: Update

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [metrolist-release]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Point the cask and formula at the latest release
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update.py
      - name: Commit
        if: steps.update.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "metrolist $VERSION"
          git push
      - name: Test the update
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --ref main
