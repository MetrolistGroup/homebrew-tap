name: Update

# Metrolist's release workflow calls this right after publishing a stable release.
# Run it by hand to retry a failed update.
on:
  workflow_call:
    secrets:
      DEPLOY_KEY:
        description: Write deploy key for this repository.
        required: true
  workflow_dispatch:

# Pushes use the deploy key, which also starts test.yml; the token only reads release metadata.
permissions:
  contents: read

concurrency:
  group: homebrew-tap-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MetrolistGroup/homebrew-tap
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      - name: Point the cask and formula at the latest release
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update.py
      - name: Commit
        if: steps.update.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "metrolist $VERSION"
          git push
