name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cask:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Tap this checkout
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/metrolistgroup"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/metrolistgroup/homebrew-tap"
          brew trust metrolistgroup/tap
      - run: brew style --cask metrolistgroup/tap/metrolist
      - run: brew audit --cask --online --strict metrolistgroup/tap/metrolist
      - run: brew install --cask metrolistgroup/tap/metrolist
      - name: Check the cask install
        run: |
          if [ "$(uname)" = Darwin ]; then
            test -d /Applications/Metrolist.app
          else
            test -x "$HOME/Applications/Metrolist.AppImage"
            data_home="${HOMEBREW_XDG_DATA_HOME:-${XDG_DATA_HOME:-$HOME/.local/share}}"
            test -f "$data_home/applications/Metrolist.desktop"
          fi

  formula:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Tap this checkout
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/metrolistgroup"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/metrolistgroup/homebrew-tap"
          brew trust metrolistgroup/tap
      - run: brew style metrolistgroup/tap/metrolist
      - run: brew audit --formula --online --strict metrolistgroup/tap/metrolist
      - run: brew install metrolistgroup/tap/metrolist
      - run: brew test metrolistgroup/tap/metrolist
      - run: test -x "$(brew --prefix)/bin/metrolist"
